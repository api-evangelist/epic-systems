      resourceType: CapabilityStatement
      metadataUrl: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4/metadata
      status: 200
      software: Epic (May 2026, releaseDate 2026-05-11)
      resourceTypeCount: 59
      interactions:
        read: 59
        search-type: 56
        create: 11
        update: 7
      file: fhir/epic-fhir-r4-capabilitystatement.json
    - version: STU3
      fhirVersion: 3.0.1
      resourceType: CapabilityStatement
      metadataUrl: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/STU3/metadata
