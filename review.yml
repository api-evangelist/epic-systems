  developerPortal:
    url: https://fhir.epic.com/
    status: 200
    confirmed: true
    note: >-
      "Epic on FHIR" is Epic's free public developer portal (also reachable at
      https://open.epic.com/, status 200). It provides a testing sandbox,
      client registration, FHIR specifications, and developer documentation.
  fhirCapability:
    captured: true
    versions:
    - version: R4
