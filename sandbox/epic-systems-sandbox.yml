bulk_data_fixture:
  group_fhir_id: e3iabhmS8rsueyz7vaimuiaSmfGvi.QwjVXJANlPOgR83
  detail: >-
    Test FHIR Group for exercising Bulk Data ($export) in the sandbox. It
    contains the test patients listed above. Epic grants a client record access
    to this Group automatically only if the registered app selects ALL FOUR bulk
    APIs (Kick-off, Status Request, File Request, Delete Request) plus the
    Search interaction of each resource to be exported.
    Example scope set for demographics + immunizations: Bulk Data Kick-off,
    Bulk Data Status Request, Bulk Data File Request, Bulk Data Delete Request,
    Patient.Search (R4), Immunization.Search (R4).
in_browser_console:
  name: Try It
  detail: >-
    Every API specification page on https://fhir.epic.com/Specifications carries
    a "Try It" form in the top right that executes preconfigured requests
    against the sandbox and shows the response without writing code. Forms are
    editable. Epic notes Try It uses a HARDCODED test app, and recommends moving
    to an HTTP client (Epic names Bruno and Postman) for real testing; the "Raw
    Request" from a Try It can be copied straight into that client.
responsible_use:
  note: Epic publishes explicit sandbox fair-use guidance; captured because it is the closest thing to a documented sandbox limit.
  rules:
  - Schedule recurring API calls for a limited window (~one week) and disable the schedule once validated.
  - Do not loop infinitely across all sandbox records; exercise a specific subset of records.
  detail: The sandbox carries many concurrent app connections; these practices protect other developers' testing.
patient_context_caveat: >-
  FHIR APIs can return DIFFERENT data in a patient-facing context than in a
  provider-facing one - patient-invisible data is filtered, patient-entered but
  unreconciled data may be withheld, patient-friendly medication names may be
  substituted, and specific lab results may be excluded for state/local
  regulatory reasons. Filtering is configurable per Epic community member, so
  two customers can behave differently. Epic advises testing each API at each
  community member site before go-live.
