note: >-
  Epic runs a free, publicly documented FHIR sandbox at
  https://fhir.epic.com/interconnect-fhir-oauth/ and publishes its test
  identities openly - test user logins, test patient FHIR IDs / MRNs / MyChart
  credentials, and a Bulk Data test Group ID. Every value below is published
  verbatim by Epic in its own developer documentation; none was invented or
  inferred. The sandbox is exclusively secured with OAuth 2.0 (there is no
  unauthenticated mode and no API-key mode), so there is no test-key vs live-key
  prefix scheme of the kind payments APIs use. Separation between test and
  production is by ENVIRONMENT and by CLIENT RECORD: an app registered on Epic
  on FHIR gets a non-production client ID for the sandbox, and a separate
  production client ID that must be downloaded by each connected health system
  before it will authenticate.
environments:
  sandbox:
    name: Epic on FHIR sandbox
    base: https://fhir.epic.com/interconnect-fhir-oauth/
    fhir_bases:
    - https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4
    - https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/STU3
    - https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/DSTU2
    self_serve: true
    cost: free
    auth: OAuth 2.0 only (SMART on FHIR)
  production:
    name: Connected Epic community member environment
    base: per health system (see the published FHIR endpoint directory)
    endpoint_directory: https://open.epic.com/MyApps/Endpoints
    self_serve: false
    gate: >-
      Requires a separate production client ID plus the connected health
      system's download/enablement of the app. Client records distribute to
      customer environments on a rolling 12-hour cycle, so a successful
      production authentication can lag enablement by up to 12 hours.
credential_model:
  style: oauth2-client-record
  key_prefixes: none
  detail: >-
    No test/live key prefix. Apps hold a non-production client ID for the
    sandbox and a distinct production client ID. Backend (client-credentials)
    apps authenticate with private_key_jwt; Epic is retiring static .pem public
    keys in favor of a hosted JWK Set URL (JKU) - see
    changelog/epic-systems-changelog.yml for the dated schedule.
