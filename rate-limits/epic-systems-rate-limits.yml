limits:
- name: Daily document query ceiling
  scope: per-app-per-customer
  window: day
  limit: null
  detail: Epic error code 4135 - Fatal - "Please try again tomorrow", logged when the maximum number of
    document queries has been reached for the day. The numeric ceiling is not published and is configured
    per community member.
  observed_signal: OperationOutcome error code 4135
  source: https://fhir.epic.com/Specifications
  limit_text: Please try again tomorrow Maximum document queries has been reached for the day.
- name: Patient.Search result cap
  scope: per-request
  limit: 100
  unit: results
  detail: Epic error code 4127 - Fatal - "Additional data may exist", logged whenever Patient.Search exceeds
