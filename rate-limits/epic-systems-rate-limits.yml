note: 'Epic publishes NO numeric request-rate table, NO rate-limit response headers, and NO documented
  429 / Retry-After behaviour for its FHIR APIs. That is not a documentation gap so much as a consequence
  of the deployment model: every Epic FHIR endpoint is an instance run by an individual health system
  ("community member") on its own InterConnect configuration, so throughput is set per customer and negotiated
  per app rather than published by the vendor. An agent integrating with Epic therefore cannot read a
  limit from a header or a docs table - it must be defensive by construction. What Epic DOES publish,
  and what is captured below, are hard result caps, a documented daily ceiling surfaced as an error code,
  and quantified system-impact budgets an app must meet to pass Epic''s app review. These are real, published,
  enforceable constraints, so they are recorded as limits; the absence of a per-second rate is recorded
  as an absence. 2026-10-20: the two operational-database consumption-budget rows (1% peak / 5% off-peak,
  App Developer Guidelines) were removed because that wording could not be found verbatim on https://fhir.epic.com/Documentation?docId=developerguidelines
  as fetched today.'
signaling:
  headers: []
  header_note: No X-RateLimit-*, no RateLimit-*, and no Retry-After are documented for the Epic FHIR APIs.
    There is no documented HTTP 429 response. Exhaustion is surfaced instead inside the FHIR OperationOutcome
    as an Epic numeric error code (see errors/epic-systems-error-codes.yml).
  exhaustion_status: undocumented
  exhaustion_signal: OperationOutcome issue with an Epic error code (e.g. 4135, 4127)
