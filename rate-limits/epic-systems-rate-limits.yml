  observed_signal: OperationOutcome error code 4127
  source: https://fhir.epic.com/Specifications
  limit_text: Additional data may exist This error is logged whenever Patient.Search exceeds 100 results.
- name: Search result processing cap
  scope: per-request
  limit: 100
  unit: results
  detail: Epic error code 59133 - Information - "Processing issues", logged when fewer data elements than
