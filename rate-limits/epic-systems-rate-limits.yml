sandbox_fair_use:
  detail: The public sandbox has no published numeric limit but carries explicit fair-use rules - bound
    any recurring call schedule to about a week and disable it once validated; do not loop across all
    sandbox records, exercise a chosen subset instead.
  source: https://fhir.epic.com/Documentation?docId=testpatients
pagination_interaction:
  detail: Cached search sessions expire - Epic error code 4113, Fatal, "Session ID for cached search results
    has expired", returned when a client requests a previously paginated result set after expiry. A long-running
    agent walking Bundle.link[next] must handle re-issue of the original search.
  detail_ref: conventions/epic-systems-conventions.yml
