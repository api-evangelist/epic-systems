note: >-
  Epic Systems publishes NO Model Context Protocol server. Searched Epic's own
  developer surface (fhir.epic.com, open.epic.com, vendorservices.epic.com), the
  npm registry, and public MCP directories; probed https://fhir.epic.com/mcp and
  https://mcp.epic.com/. fhir.epic.com answers an identical 56,634-byte HTML
  shell for /mcp, /api-docs and /.well-known/oauth-protected-resource - a
  catch-all soft-200, not a server - and mcp.epic.com does not resolve. Community
  and third-party "Epic FHIR MCP" projects exist on npm and GitHub but none is
  published by Epic Systems Corporation, so none is recorded as Epic's.
  The tools[] below are a DERIVED CANDIDATE surface, computed from the resource
  types and interactions Epic actually advertises in its live R4 sandbox
  CapabilityStatement. They describe what an MCP server over Epic's FHIR API
  would expose; they are not a server anyone can call today. Because no server
  exists, this artifact deliberately carries NO `MCPServer` pointer in apis.yml -
  emitting one would credit Epic with an agent surface it does not ship.
