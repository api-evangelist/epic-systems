tools:
- name: Patient.Search
  description: Search for patients by demographics or identifier. Capped at 100 results (Epic error 4127).
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Patient.search-type
- name: Patient.Read
  description: Read a single Patient resource by FHIR ID.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Patient.read
- name: Patient.Match
  description: Probabilistic patient matching via the $match operation.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Patient.$match
- name: Patient.Summary
  description: Retrieve a patient summary via the $summary operation.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Patient.$summary
- name: Observation.Search
  description: Search observations (labs, vitals, smoking history) for a patient; category is a required search parameter.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Observation.search-type
- name: Observation.Create
  description: File a patient-entered or device reading to a vital-signs flowsheet row. Fails with 59187/59188/59189 when no mapped flowsheet exists.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Observation.create
- name: Condition.Search
  description: Search a patient's problem list, encounter diagnoses and health concerns.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Condition.search-type
- name: MedicationRequest.Search
  description: Search a patient's medication orders and prescriptions.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#MedicationRequest.search-type
- name: AllergyIntolerance.Search
  description: Search a patient's documented allergies and intolerances.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#AllergyIntolerance.search-type
- name: DocumentReference.Search
  description: Search clinical documents and notes; subject to a daily document-query ceiling (Epic error 4135).
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#DocumentReference.search-type
- name: Appointment.Search
  description: Search a patient's scheduled and upcoming appointments.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Appointment.search-type
- name: Group.Export
  description: Kick off a FHIR Bulk Data ($export) job for a population Group; requires client-credentials with private_key_jwt.
  source_operation: fhir/epic-fhir-r4-capabilitystatement.json#Group.$group-export
agent_cautions:
- Data returned varies by patient-facing vs provider-facing context and by each community member's filtering configuration - identical requests can legitimately return different data at two customers.
- Break-the-Glass restrictions (errors 4130, 4131, 4134) are a real authorization outcome on sensitive charts, not a failure to retry.
- Writes are narrow - of 59 R4 resource types, 59 advertise read and 56 search-type, but only 11 advertise create and 7 update. This API is overwhelmingly read-only.
- There is no single production base URL; a server must resolve the customer's endpoint from fhir/epic-systems-endpoint-catalog.yml.
