- aid: epic-systems:epic-fhir-bulk-data-api
  name: Epic FHIR Bulk Data Access API
  description: >-
    Epic's implementation of the HL7 FHIR Bulk Data Access (Flat FHIR)
    specification, providing backend system-level population export via the
    $export operation, authorized with OAuth 2.0 client-credentials
    (asymmetric client authentication). Documented on Epic on FHIR; production
    access is client-registration and health-system gated.
  humanURL: https://fhir.epic.com/Documentation?docId=bulkdataaccesstutorial
  baseURL: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4
