- aid: epic-systems:epic-cds-hooks-api
  name: Epic CDS Hooks API
  description: >-
    Epic's support for the CDS Hooks specification, letting external clinical
    decision support services return cards and SMART app launch links at
    documented workflow hook points inside the Epic EHR. Documented on Epic on
