name: Epic Systems
kind: company
description: >-
  Epic Systems Corporation is a privately held electronic health record (EHR/EMR)
  software company founded in 1979 and headquartered in Verona, Wisconsin, United
  States. Epic's software supports the medical records of a large share of U.S.
  hospital systems and academic medical centers, and its "Epic on FHIR" developer
  program (fhir.epic.com / open.epic.com) exposes a standards-based HL7 FHIR
  interoperability surface for patient- and provider-facing apps. Epic serves
  live, public sandbox FHIR endpoints across three FHIR versions - R4 (4.0.1),
  STU3 (3.0.1), and DSTU2 (1.0.2) - aligned to the US Core implementation guides,
  with SMART on FHIR / OAuth 2.0 authorization, CDS Hooks, and FHIR Bulk Data
  ($export) access. Production access requires client registration and a health
  system's participation; the developer sandbox, specifications, and
  CapabilityStatements are openly published. Epic is a core node of the U.S.
  healthcare interoperability landscape shaped by the ONC/CMS 21st Century Cures
  Act information-blocking rules and TEFCA.
