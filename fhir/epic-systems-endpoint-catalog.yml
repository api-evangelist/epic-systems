note: >-
  Epic publishes a live, anonymous, machine-readable directory of every
  production FHIR base URL its customers run - served as HL7 FHIR Endpoint
  Bundles at open.epic.com/Endpoints/<version>. This is the closest thing Epic
  operates to an RFC 9727 /.well-known/api-catalog, and it matters more than the
  well-known probe result: the Epic FHIR API has no single production base URL,
  because each community member hosts its own instance, so this document IS the
  resolution layer between "Epic" and a callable host. Each entry is a FHIR
  Endpoint resource carrying the organization name (as a contained Organization),
  status, connectionType hl7-fhir-rest, payload type/MIME, and the base
  `address`. Both bundles were fetched anonymously with no credentials and saved
  verbatim; the /.well-known/api-catalog path on epic.com and open.epic.com
  returns 404/302 (recorded in well-known/epic-systems-well-known.yml), so this
  catalog is discoverable only from the docs, not from a well-known path.
