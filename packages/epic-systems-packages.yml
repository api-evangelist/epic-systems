  is not an exhaustive list, nor maintained or affiliated with Epic, the
  following resources might be helpful" - and points developers at the generic
  open-source SMART on FHIR ecosystem (the smart-on-fhir `fhirclient` library
  for single-page apps, AppAuth for native apps) instead of an Epic-branded
  package. Because Epic implements HL7 FHIR R4/STU3/DSTU2 and SMART on FHIR as
  published standards, any conformant FHIR client works against the Epic
  endpoints; the integration surface is the standard, not a vendor SDK. Registry
