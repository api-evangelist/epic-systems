  software_release:
    scheme: named-release
    current: May 2026
    detail: Epic ships four named releases a year (February / May / August / November). API behaviour
      changes are announced in-place in the relevant documentation topic as 'Starting in the <Month Year>
      version of Epic...'. Because each health system upgrades on its own schedule, a change takes effect
      PER CUSTOMER at upgrade rather than on a date. Structured recent entries are captured in changelog/epic-systems-changelog.yml.
    next_announced: August 2026
    note: Epic's documentation describes August 2026 behaviour in the future tense, so May 2026 is recorded
      as current and August 2026 as announced. Epic does not publish release dates on the open developer
      site, so no release_date is asserted.
