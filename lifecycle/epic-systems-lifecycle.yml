deprecation:
  policy: Epic publishes no single deprecation-policy page and no Sunset/Deprecation header support. What
    it does publish is a per-change, multi-release retirement schedule stated in the affected documentation
    topic, plus an App Developer Guidelines commitment to 'backward compatibility for APIs or interfaces
    unless deprecation is clearly communicated in advance'. DSTU2 and STU3 remain served for existing
    integrations; new development is directed to R4 / US Core.
  sunset_header: false
  deprecation_header: false
  policy_url: https://fhir.epic.com/Documentation?docId=developerguidelines
  worked_example:
    name: Static public keys for backend OAuth 2.0
    detail: Announced and retired across four named releases (Aug 2025 -> Aug 2026). This is the clearest
      published deprecation Epic runs and is the model for how API change is communicated.
    detail_ref: changelog/epic-systems-changelog.yml
sla:
